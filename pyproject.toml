[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pure-posttraining"
version = "0.3.0"
description = "PURE objectives and recovered Pi3, DA3 and VGGT training/inference"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
training = ["torch>=2.2", "numpy>=1.24,<2", "Pillow>=10", "safetensors>=0.4", "addict>=2.4", "einops>=0.7"]
inference = ["torch>=2.2,<3", "numpy>=1.24,<2", "Pillow>=10,<12", "safetensors>=0.4", "huggingface-hub>=0.34,<1", "addict>=2.4", "einops>=0.7", "av>=12,<20", "matplotlib>=3.8", "trimesh>=4.8,<5", "transformers==4.46.3"]
space = ["pure-posttraining[inference]", "torch==2.8.0", "gradio==5.49.1", "spaces>=0.48.1,<1"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["pure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
pure = ["resources/*.json", "resources/LICENSE", "resources/*.md", "resources/LICENSES/*.txt"]
